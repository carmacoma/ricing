# ~/.config/starship.toml — Catppuccin Mocha prompt
# Docs: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""
add_newline = true
palette = "catppuccin_mocha"

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "green"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "peach"
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[took $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay1 = "#7f849c"
surface0 = "#313244"
base = "#1e1e2e"
